server:
  port: 8083

spring:
  application:
    name: order-service
  
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:h2:mem:order_db
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  flyway:
    enabled: false
  
  data:
    redis:
      host: localhost
      port: 6379

services:
  product:
    url: http://localhost:8081
  inventory:
    url: http://localhost:8082

logging:
  level:
    com.ecommerce: DEBUG
