server:
  port: 8083

spring:
  application:
    name: order-service
  
  # Enable Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true
  
  # Jackson configuration
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  
  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
        "[default_batch_fetch_size]": 20
    show-sql: false
  
  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# Service URLs
services:
  product:
    url: http://localhost:8081
  inventory:
    url: http://localhost:8082

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    "[com.ecommerce]": DEBUG
    "[org.hibernate.SQL]": DEBUG
