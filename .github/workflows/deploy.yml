name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Docker Image
      run: |
        ./gradlew bootJar
        echo "Building image for ${{ github.event.inputs.environment }}..."
        # Actual docker build/push would go here
        
    - name: Deploy to Environment
      run: |
        echo "Deploying to ${{ github.event.inputs.environment }}..."
        # Deployment logic for k8s or docker-compose
