spring:
  application:
    name: api-gateway
  
  # Thread configuration - Virtual Threads
  threads:
    virtual:
      enabled: true
  
  # Cloud Gateway configuration
  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:3001"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            maxAge: 3600
      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      # Discovery configuration (disabled for now, using static routes)
      discovery:
        locator:
          enabled: false
    # Compatibility verifier
    compatibility-verifier:
      enabled: false
  
  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

# App Services Configuration (Renamed to ecommerce to avoid IDE conflicts)
ecommerce:
  services:
    product-url: ${SERVICE_PRODUCT_URL:http://localhost:8081}
    inventory-url: ${SERVICE_INVENTORY_URL:http://localhost:8082}
    order-url: ${SERVICE_ORDER_URL:http://localhost:8083}
    payment-url: ${SERVICE_PAYMENT_URL:http://localhost:8084}
    notification-url: ${SERVICE_NOTIFICATION_URL:http://localhost:8085}
    auth-url: ${SERVICE_AUTH_URL:http://localhost:8086}

# Server configuration
server:
  port: 8080
  shutdown: graceful

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for development
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Logging configuration
logging:
  level:
    root: INFO
    "[com.ecommerce.gateway]": DEBUG
    "[org.springframework.cloud.gateway]": DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{userId:-}] %logger{36} - %msg%n"

# JWT Configuration
jwt:
