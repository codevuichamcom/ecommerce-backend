spring:
  application:
    name: api-gateway-test
  
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false

# Disable actuator endpoints for tests
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,gateway
  health:
    redis:
      enabled: false
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging
logging:
  level:
    root: WARN
    "[com.ecommerce.gateway]": INFO

