# Testing rules - Unit, integration, contract, performance, chaos

testing:
  frameworks:
    unit: JUnit 5
    mocking: Mockito
    assertion: AssertJ
    integration: Testcontainers
    contract: Pact
    performance: Gatling / k6
    chaos: Chaos Monkey for Spring Boot

  naming_convention: given_{scenario}_when_{action}_then_{result}

  coverage_thresholds:
    service_layer: 70
    domain_layer: 80
    infrastructure_layer: 50

  patterns:
    - Triple A (Arrange, Act, Assert)
    - Test Driven Development (TDD) encouraged

  integration_testing:
    use_testcontainers_for: [PostgreSQL, Redis, Kafka]
    scope: "Business logic spanning multiple components/persistence"

  contract_testing:
    required_for: "All service-to-service communication via REST/Kafka"
    consumer_side: "Define pacts"
    provider_side: "Verify pacts"

  performance_testing:
    scope: "Critical paths: Search, Cart, Checkout"
    must_track: [latency_p95, throughput, error_rate]

  chaos_testing:
    rules: "Test resilience against: DB latency, Kafka Down, Service Down"

best_practices:
  - "Tests should be independent and repeatable"
  - "No flaky tests - investigate and fix or delete"
  - "Mock external dependencies, use real DB for integration tests"

forbid:
  - skipping_tests_in_ci
  - production_code_in_tests
  - hardcoded_absolute_paths_in_tests
