# API Design rules - REST, versioning, error handling, documentation

api:
  conventions: RESTful
  format: JSON
  
  versioning:
    strategy: URI_versioning
    format: "/api/v{number}/..."
    deprecation_policy: "Maintain at least 1 previous version for 6 months"
    deprecation_notification:
      sunset_header: "Sunset: Sat, 31 Dec 2026 23:59:59 GMT"
      api_documentation: "Mark as deprecated with migration guide"
      email_notification: "Notify consumers 90 days before sunset"

  naming_conventions:
    endpoints: kebab-case
    json_fields: camelCase
    query_params: camelCase

  headers_required:
    mutations: [Idempotency-Key]
    tracing: [X-Correlation-ID]

  error_handling:
    format: RFC_7807_Problem_Details
    must_include: [type, title, status, detail, instance, timestamp]

  pagination:
    strategies: [Cursor-based (preferred), Offset-based]
    default_page_size: 20
    max_page_size: 100

  documentation:
    tool: SpringDoc_OpenAPI (Swagger)
    path: /swagger-ui.html

  rate_limiting:
    strategy: Token_Bucket
    storage: Redis  # Distributed rate limit state
    key_strategy: "user_id (authenticated) or IP (anonymous)"
    tier_customer: 100req/min
    tier_admin: 1000req/min
    response_headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
    implementation: api_gateway  # Centralized at gateway level

best_practices:
  - "Use plural nouns for resource names"
  - "Always return appropriate HTTP status codes"
  - "Validate all inputs at the entry point"

forbid:
  - breaking_changes_without_version_increment
  - returning_sensitive_data_in_api
  - verbs_in_uri_paths (use HTTP methods instead)
