# Observability rules - Metrics, logging, tracing, monitoring, alerting

observability:
  pillars: [metrics, logs, traces]
    
  metrics:
    framework: micrometer
    backend: prometheus
    visualization: grafana
    must_track: [business_metrics, application_metrics, system_metrics, custom_metrics]
    naming_convention: "{namespace}_{subsystem}_{name}_{unit}"
    labels_recommended: [service, environment, version, http_method, http_status]

  logging:
    framework: slf4j_with_logback
    format: json
    structured_logging_must_include: [timestamp, level, logger, message, correlation_id, service_name, environment]
    sensitive_data:
      never_log: [passwords, tokens, api_keys, credit_card_numbers]
      mask_in_logs: [email, phone, name]

  tracing:
    framework: micrometer_tracing
    backend: zipkin_or_jaeger
    sampling_rate: {production: 0.1, staging: 0.5, development: 1.0}
    must_trace: [http_requests, kafka_message_flow, database_queries, external_api_calls]

  health_checks:
    liveness: /actuator/health/liveness
    readiness: /actuator/health/readiness
    readiness_requires: [database, kafka, redis, downstream_services]
    kubernetes_probes: {liveness_path: /actuator/health/liveness, readiness_path: /actuator/health/readiness}

  alerting:
    tool: prometheus_alertmanager
    critical_alerts: [service_down, high_error_rate, high_latency, database_pool_exhausted, kafka_lag_high]
    warning_alerts: [high_memory_usage, high_cpu_usage, slow_database_queries]
    notification_channels: {critical: [pagerduty, slack_critical], warning: [slack_monitoring, email]}
    runbook_requirement: "All alerts MUST have a runbook."
    runbook_template: ../templates/runbook_template.md

  dashboards_must_have: [service_overview, business_metrics, kafka_monitoring, database_performance, jvm_metrics]

  slos_and_slis:
    availability_slo: 99.9%
    latency_slo_p95: 500ms
    error_rate_slo: 0.1%

best_practices:
  - "Use correlation IDs across all logs and traces"
  - "Set up alerts before going to production"
  - "Monitor business metrics, not just technical metrics"
  - "Test health checks regularly"

forbid:
  - production_without_monitoring
  - alerts_without_runbooks
  - logging_sensitive_data
