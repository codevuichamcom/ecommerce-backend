# Messaging rules - Kafka standards, patterns, schema evolution

messaging:
  platform: apache_kafka_7.5
  serialization: avro_with_schema_registry

  patterns:
    outbox: "Must use for reliable cross-service communication"
    idempotent_consumer: "Must use to prevent duplicate processing"
    saga: "Must use for distributed transactions (Orchestration preferred)"
    
  topic_naming:
    convention: "{domain}.{event_type}"
    examples: [order.created, payment.completed, inventory.reserved]

  event_structure:
    must_include: [eventId, eventType, timestamp, correlationId, payload, metadata]

  producer_rules:
    acknowledgment: all
    retries: 3
    compression: snappy
    max_message_size: 1MB

  consumer_rules:
    group_id: "{service_name}-group"
    auto_offset_reset: earliest
    error_handling: [dlq, retry_topic_with_backoff]
    concurrency: base_on_partitions

  schema_evolution:
    mode: forward_compatibility
    registry: Confluent Schema Registry

  monitoring:
    must_track: [consumer_lag, message_size, throughput, error_rate]
    alert_on: {lag > 10000, dlq_messages > 0}

best_practices:
  - "Design for failure - consumers should be idempotent"
  - "Keep event payloads small - use claim-check pattern for large data"
  - "Use correlation IDs to trace message flows"

forbid:
  - large_messages_over_1MB
  - non_standard_topic_naming
  - manual_partition_assignment
