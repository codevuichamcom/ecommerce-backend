# CI/CD Pipeline rules - Build, test, security scan, deployment standards

ci_cd:
  pipeline_tool: github_actions
  
  build_pipeline:
    triggers: [push_to_feature, pr_to_develop, pr_to_main]
    stages:
      - name: compile
        command: "./gradlew clean build -x test"
      - name: unit_test
        command: "./gradlew test"
        coverage_threshold: 70
      - name: integration_test
        command: "./gradlew integrationTest"
      - name: static_analysis
        tools: [sonarqube, checkstyle]
        quality_gate: must_pass
      - name: dependency_scan
        tools: [owasp_dependency_check, snyk]
        fail_on: [critical, high]
      - name: docker_build_scan
        tool: trivy
        images_on: [develop, main, release/*]

  deployment_strategy:
    development: {trigger: auto_merge, strategy: rolling_update}
    staging: {trigger: manual, strategy: blue_green, require_approval: [tech_lead, qa_lead]}
    production: {trigger: manual, strategy: canary, require_approval: [tech_lead, PO]}

  environment_promotion: dev → staging → production

  rollback_procedure:
    automatic: [error_rate > 5%, latency_p95 > 2000ms, health_failing]
    manual: [critical_bug, data_corruption]

  versioning:
    scheme: semantic_versioning (MAJOR.MINOR.PATCH)
    tag_format: "v{MAJOR}.{MINOR}.{PATCH}"

  monitoring_metrics: [build_success_rate, deployment_frequency, MTTR, change_failure_rate]

  secrets_management:
    tool: aws_secrets_manager_or_vault
    rules: [rotate_regularly, encrypt_at_rest, audit_access]
    forbid: [secrets_in_code, secrets_in_git]

  infrastructure_as_code:
    tool: terraform_or_cloudformation
    rules: [version_control_all_infra, use_remote_state]

best_practices:
  - "Fail fast - run quick tests first"
  - "Cache dependencies to speed up builds"
  - "Always have a rollback plan"

forbid:
  - manual_deployments_to_production
  - skipping_tests_to_speed_up_pipeline
  - deploying_on_friday_afternoon
