# Security rules - Auth, encryption, data protection

security:
  authentication:
    mechanism: JWT (JSON Web Token)
    provider: auth-service
    storage: Secure HttpOnly Cookie / Authorization Header
    
  authorization:
    framework: Spring Security
    roles: [ADMIN, CUSTOMER, SERVICE]
    access_control: Role-Based (RBAC)

  data_protection:
    encryption_at_rest: AES-256
    encryption_in_transit: TLS 1.3
    secrets_management: AWS Secrets Manager (Rotation: 90 days)

  input_validation:
    library: Hibernate Validator (Jakarta Bean Validation)
    rules: [XSS prevention, SQL injection prevention, No-SQL injection prevention]

  security_headers:
    - Content-Security-Policy
    - X-Frame-Options: DENY
    - X-Content-Type-Options: nosniff
    - Strict-Transport-Security

  cors_policy:
    allowed_origins: ["${CORS_ALLOWED_ORIGINS}"]  # Environment variable, e.g., "https://app.ecommerce.com,https://admin.ecommerce.com"
    allowed_methods: [GET, POST, PUT, DELETE, PATCH]
    allow_credentials: true

  auditing:
    tool: Spring Data Envers / Custom Audit Log
    tracked_actions: [Login, Logout, Data Modification, Permission Change]

  vulnerability_scanning:
    tools: [Snyk, OWASP Dependency Check]
    frequency: Daily in CI

best_practices:
  - "Defense in depth"
  - "Principle of least privilege"
  - "Never log sensitive data"
  - "Use secure defaults"

forbid:
  - hardcoded_secrets
  - logging_pii_unmasked
  - disabled_cors_in_production
