# Git and Branching rules - Git Flow, commit conventions, PR standards

git:
  workflow: git_flow
  
  branches:
    main: {description: "Production", protected: true, require_review: true, min_reviewers: 2}
    develop: {description: "Integration", protected: true, require_review: true, min_reviewers: 1}
    feature: {naming: "feature/{ticket-id}-{desc}", from: develop, to: develop}
    bugfix: {naming: "bugfix/{ticket-id}-{desc}", from: develop, to: develop}
    hotfix: {naming: "hotfix/{ticket-id}-{desc}", from: main, to: [main, develop]}
    release: {naming: "release/{version}", from: develop, to: [main, develop]}

  commit_message:
    format: conventional_commits
    structure: "<type>[optional scope]: <description>"
    types: [feat, fix, docs, style, refactor, test, build, ci, chore, revert]
    must: [imperative_mood, subject_limit_50, reference_ticket_in_footer]

  merge_strategy:
    feature_to_develop: squash
    bugfix_to_develop: squash
    hotfix_to_main: merge_commit
    release_to_main: merge_commit

  pull_request:
    naming: "[{Type}] {Ticket-ID}: {Description}"
    template: ../templates/pr_template.md
    review_requirements: {feature: 1, bugfix: 1, hotfix: 2, refactor: 2, breaking: 2}

best_practices:
  - "Branch early, commit often"
  - "Keep commits atomic and focused"
  - "Rebase feature branches on develop regularly"
  - "Don't commit directly to main or develop"

forbid:
  - force_push_to_protected_branches
  - merge_without_review
  - wip_commits_in_pr
