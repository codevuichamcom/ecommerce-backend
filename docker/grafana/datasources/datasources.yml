# ============================================================================
# Grafana Datasources Configuration
# ============================================================================
# Auto-provisioned datasources for E-Commerce monitoring stack
# ============================================================================

apiVersion: 1

datasources:
  # ==========================================================================
  # PROMETHEUS - Metrics
  # ==========================================================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:
        # Link metrics to traces in Zipkin
        - name: trace_id
          datasourceUid: zipkin

  # ==========================================================================
  # LOKI - Logs
  # ==========================================================================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link logs to traces using trace_id
        - datasourceUid: zipkin
          matcherRegex: "traceId[=:]([\\w]+)"
          name: TraceID
          url: "$${__value.raw}"
        # Link to specific service logs
        - datasourceUid: loki
          matcherRegex: "service[=:]([\\w-]+)"
          name: Service
          url: "$${__value.raw}"

  # ==========================================================================
  # ZIPKIN - Distributed Tracing
  # ==========================================================================
  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
    isDefault: false
    editable: true
    jsonData:
      tracesToLogsV2:
        # Link traces to logs using trace_id
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
        query: '{trace_id="$${__span.traceId}"}'
      tracesToMetrics:
        # Link traces to metrics
        datasourceUid: prometheus
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        queries:
          - name: 'Request Rate'
            query: 'rate(http_server_requests_seconds_count{trace_id="$${__span.traceId}"}[5m])'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
