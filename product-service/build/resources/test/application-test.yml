server:
  port: 8081

spring:
  application:
    name: product-service
  
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:h2:mem:product_db
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  flyway:
    enabled: false

logging:
  level:
    com.ecommerce: DEBUG
